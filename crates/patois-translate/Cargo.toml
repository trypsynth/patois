[package]
name = "patois-translate"
version = "0.1.0"
edition = "2024"
description = "Machine translation of gettext catalogs and Markdown readmes through the Claude API, for patois apps."
license = "MIT"
keywords = ["i18n", "l10n", "gettext", "translation", "claude"]
categories = ["localization", "internationalization", "development-tools"]

[dependencies]
patois = { version = "0.2.2", path = "../patois" }
patois-build = { version = "0.1.15", path = "../patois-build" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", features = ["json"] }
